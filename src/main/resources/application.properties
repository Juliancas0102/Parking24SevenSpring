spring.application.name=parking24seven-spring
server.port=8081

# Conexión MySQL. La contraseña se recibe por variable de entorno DB_PASSWORD.
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/parking24seven?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
